<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DRACK HUB</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}


#mainNav{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:10px 3%;
  background:#101010;
  border-bottom:1px solid #292929;
}

#mainNav a{
  flex:0 0 auto;
  text-decoration:none;
  color:#fff;
  background:#1d1d1d;
  padding:10px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

#mainNav a:active{
  background:#fff;
  color:#000;
}

header{
  padding:25px 16px;
  text-align:center;
  background:#151515;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.sub{
  color:#aaa;
  margin-top:6px;
}

.container{
  width:94%;
  max-width:750px;
  margin:auto;
  padding:18px 0 40px;
}

.search{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#171717;
  color:#fff;
  font-size:15px;
  margin-bottom:12px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
}

.categories button{
  white-space:nowrap;
  border:0;
  border-radius:20px;
  padding:10px 15px;
  background:#222;
  color:#fff;
  font-weight:bold;
}

.categories button.active{
  background:#fff;
  color:#000;
}

.post{
  background:#151515;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:18px;
}

.post-image{
  width:100%;
  max-height:380px;
  object-fit:cover;
  display:block;
}

.post-body{
  padding:18px;
}

.category{
  color:#aaa;
  font-size:13px;
  font-weight:bold;
}

.title{
  font-size:23px;
  margin:8px 0;
}

.content{
  color:#ddd;
  line-height:1.6;
  white-space:pre-wrap;
}

.date{
  color:#777;
  font-size:12px;
  margin-top:14px;
}

.read{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  margin-top:15px;
  font-weight:bold;
  background:#fff;
  color:#000;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    🤖 DRACK HUB
  </div>

  <div class="sub">
    Habari • Michezo • Updates
  </div>

</header>


<nav id="mainNav">
  <a href="/home.html">🏠 Home</a>
  <a href="/home.html?category=NEWS">📰 News</a>
  <a href="/home.html?category=SPORTS">⚽ Sports</a>
  <a href="/home.html?category=UPDATES">📢 Updates</a>
  <a href="http://www.fawanews.sc/index.html" target="_blank" rel="noopener noreferrer">⚽ FawaNews</a>
</nav>

<div class="container">

  <input
    id="search"
    class="search"
    placeholder="🔎 Tafuta habari..."
    oninput="renderPosts()"
  >

  <div class="categories">

    <button
      class="active"
      onclick="setCategory('ALL',this)"
    >
      🏠 ZOTE
    </button>

    <button
      onclick="setCategory('NEWS',this)"
    >
      📰 NEWS
    </button>

    <button
      onclick="setCategory('SPORTS',this)"
    >
      ⚽ SPORTS
    </button>

    <button
      onclick="setCategory('UPDATES',this)"
    >
      📢 UPDATES
    </button>

  </div>

  <div id="posts">
    Inapakia...
  </div>

</div>

<script>

let posts = [];

let category =
  "ALL";

async function loadPosts(){

  try{

    const response =
      await fetch("/api/posts");

    const data =
      await response.json();

    posts =
      data.posts || [];

    renderPosts();

  }catch(error){

    document.getElementById("posts")
      .innerHTML =
      `<div class="empty">
        ❌ Server haipatikani.
      </div>`;

  }

}

function setCategory(value,button){

  category =
    value;

  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderPosts();

}

function renderPosts(){

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  const filtered =
    posts.filter(post => {

      const text =
        (
          post.title +
          " " +
          post.content
        ).toLowerCase();

      const matchesSearch =
        text.includes(search);

      const matchesCategory =
        category === "ALL" ||
        post.category === category;

      return matchesSearch &&
             matchesCategory;

    });

  const box =
    document.getElementById("posts");

  if(!filtered.length){

    box.innerHTML =
      `<div class="empty">
        Hakuna habari iliyopatikana.
      </div>`;

    return;

  }

  box.innerHTML =
    filtered.map(post => `

      <article class="post">

        ${
          post.image
          ?
          `<img
             class="post-image"
             src="${post.image.startsWith("/") ? window.location.origin + post.image : post.image}"
             onerror="this.style.display='none'"
           >`
          :
          ""
        }

        <div class="post-body">

          <div class="category">
            ${escapeHtml(post.category)}
          </div>

          <div class="title">
            ${escapeHtml(post.title)}
          </div>

          <div class="content">
            ${escapeHtml(post.content)}
          </div>

          <div class="date">
            🕒 ${escapeHtml(post.date)}
          </div>

          ${
            post.link
            ?
            `<button
               class="read"
               onclick="openLink('${encodeURI(post.link)}')"
             >
               🔗 SOMA ZAIDI
             </button>`
            :
            ""
          }

        </div>

      </article>

    `).join("");

}

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function openLink(link){

  window.open(
    link,
    "_blank"
  );

}

loadPosts();

</script>

</body>
</html>
