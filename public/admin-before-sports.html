<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRACK ADMIN</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:20px 16px;
  text-align:center;
  background:#151515;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:26px;
  font-weight:bold;
}

.sub{
  color:#999;
  margin-top:5px;
}

.container{
  width:94%;
  max-width:700px;
  margin:auto;
  padding:18px 0 40px;
}

.card{
  background:#151515;
  padding:18px;
  border-radius:16px;
  margin-bottom:16px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
}

.publish{
  background:#fff;
  color:#000;
}

.edit{
  background:#444;
  color:#fff;
}

.delete{
  background:#8b0000;
  color:#fff;
}

.cancel{
  background:#333;
  color:#fff;
}

.file{
  background:#222;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-top:12px;
  display:none;
}

.message{
  text-align:center;
  margin-top:12px;
  font-weight:bold;
}

.success{
  color:#45ff88;
}

.error{
  color:#ff5555;
}

.post{
  border-top:1px solid #333;
  padding-top:15px;
  margin-top:15px;
}

.post:first-child{
  border-top:0;
  padding-top:0;
  margin-top:0;
}

.post img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

.meta{
  color:#999;
  font-size:13px;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">👑 DRACK ADMIN</div>
  <div class="sub">Manage DRACK HUB</div>
</header>

<div class="container">

  <!-- CREATE / EDIT -->

  <div class="card">

    <h2 id="formTitle">➕ Tengeneza Post</h2>

    <input
      id="title"
      placeholder="Kichwa cha habari"
    >

    <select id="category">
      <option value="NEWS">📰 NEWS</option>
      <option value="SPORTS">⚽ SPORTS</option>
      <option value="UPDATES">📢 UPDATES</option>
    </select>

    <textarea
      id="content"
      placeholder="Andika taarifa yako hapa..."
    ></textarea>

    <input
      id="imageFile"
      class="file"
      type="file"
      accept="image/*"
    >

    <img id="preview" class="preview">

    <input
      id="link"
      placeholder="Link nyingine (optional)"
    >

    <button
      id="publishButton"
      class="publish"
      onclick="savePost()"
    >
      📢 PUBLISH
    </button>

    <button
      id="cancelButton"
      class="cancel hidden"
      onclick="cancelEdit()"
    >
      ❌ CANCEL EDIT
    </button>

    <div id="message" class="message"></div>

  </div>

  <!-- SEARCH -->

  <div class="card">

    <h2>🔎 Tafuta Post</h2>

    <input
      id="search"
      placeholder="Andika jina la post..."
      oninput="renderPosts()"
    >

    <select
      id="filter"
      onchange="renderPosts()"
    >
      <option value="ALL">📂 Categories Zote</option>
      <option value="NEWS">📰 NEWS</option>
      <option value="SPORTS">⚽ SPORTS</option>
      <option value="UPDATES">📢 UPDATES</option>
    </select>

  </div>

  <!-- POSTS -->

  <div class="card">

    <h2>📋 Posts Zako</h2>

    <div id="posts">
      Inapakia...
    </div>

  </div>

</div>

<script>

let posts = [];
let editingId = null;
let currentImage = "";

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

imageFile.addEventListener("change", () => {

  const file = imageFile.files[0];

  if (!file) return;

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";

});

async function loadPosts(){

  try{

    const response =
      await fetch("/api/posts");

    const data =
      await response.json();

    posts =
      data.posts || [];

    renderPosts();

  }catch(error){

    document.getElementById("posts").innerText =
      "❌ Server haipatikani.";

  }

}

function renderPosts(){

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  const filter =
    document.getElementById("filter").value;

  const box =
    document.getElementById("posts");

  const results =
    posts.filter(post => {

      const matchesSearch =
        post.title
          .toLowerCase()
          .includes(search) ||
        post.content
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        filter === "ALL" ||
        post.category === filter;

      return matchesSearch &&
             matchesCategory;

    });

  if (!results.length){

    box.innerHTML =
      "<p>Hakuna post iliyopatikana.</p>";

    return;

  }

  box.innerHTML =
    results.map(post => `

      <div class="post">

        <strong>
          ${escapeHtml(post.category)}
        </strong>

        <h3>
          ${escapeHtml(post.title)}
        </h3>

        ${
          post.image
          ?
          `<img src="${post.image}">`
          :
          ""
        }

        <p>
          ${escapeHtml(post.content)}
        </p>

        <div class="meta">
          ${escapeHtml(post.date)}
        </div>

        <div class="actions">

          <button
            class="edit"
            onclick="startEdit(${post.id})"
          >
            ✏️ EDIT
          </button>

          <button
            class="delete"
            onclick="deletePost(${post.id})"
          >
            🗑️ DELETE
          </button>

        </div>

      </div>

    `).join("");

}

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

async function uploadImage(){

  const file =
    imageFile.files[0];

  if (!file){

    return currentImage;

  }

  const formData =
    new FormData();

  formData.append(
    "image",
    file
  );

  const response =
    await fetch("/api/upload",{

      method:"POST",

      body:formData

    });

  const data =
    await response.json();

  if (!data.success){

    throw new Error(
      "Picha haikupakiwa"
    );

  }

  return data.image;

}

async function savePost(){

  const title =
    document.getElementById("title")
      .value.trim();

  const category =
    document.getElementById("category")
      .value;

  const content =
    document.getElementById("content")
      .value.trim();

  const link =
    document.getElementById("link")
      .value.trim();

  const message =
    document.getElementById("message");

  if (!title || !content){

    message.className =
      "message error";

    message.innerText =
      "❌ Weka kichwa na taarifa.";

    return;

  }

  try{

    message.className =
      "message";

    message.innerText =
      "📤 Inachakata...";

    const image =
      await uploadImage();

    const url =
      editingId
      ? `/api/posts/${editingId}`
      : "/api/posts";

    const method =
      editingId
      ? "PUT"
      : "POST";

    const response =
      await fetch(url,{

        method,

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          title,
          category,
          content,
          image,
          link

        })

      });

    const data =
      await response.json();

    if (!data.success){

      throw new Error(
        data.message ||
        "Imeshindikana"
      );

    }

    message.className =
      "message success";

    message.innerText =
      editingId
      ? "✅ Post imehaririwa!"
      : "✅ Post imechapishwa!";

    resetForm();

    await loadPosts();

  }catch(error){

    message.className =
      "message error";

    message.innerText =
      "❌ " + error.message;

  }

}

function startEdit(id){

  const post =
    posts.find(p => p.id === id);

  if (!post) return;

  editingId = id;

  document.getElementById("formTitle")
    .innerText =
    "✏️ Hariri Post";

  document.getElementById("title")
    .value =
    post.title;

  document.getElementById("category")
    .value =
    post.category;

  document.getElementById("content")
    .value =
    post.content;

  document.getElementById("link")
    .value =
    post.link || "";

  currentImage =
    post.image || "";

  if (currentImage){

    preview.src =
      currentImage;

    preview.style.display =
      "block";

  }

  document.getElementById("publishButton")
    .innerText =
    "💾 SAVE EDIT";

  document.getElementById("cancelButton")
    .classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function cancelEdit(){

  resetForm();

}

function resetForm(){

  editingId = null;
  currentImage = "";

  document.getElementById("formTitle")
    .innerText =
    "➕ Tengeneza Post";

  document.getElementById("title")
    .value = "";

  document.getElementById("content")
    .value = "";

  document.getElementById("link")
    .value = "";

  document.getElementById("category")
    .value = "NEWS";

  imageFile.value = "";

  preview.style.display =
    "none";

  document.getElementById("publishButton")
    .innerText =
    "📢 PUBLISH";

  document.getElementById("cancelButton")
    .classList.add("hidden");

}

async function deletePost(id){

  const post =
    posts.find(p => p.id === id);

  if (!post) return;

  const ok =
    confirm(
      "🗑️ Ufute post hii?\n\n" +
      post.title
    );

  if (!ok) return;

  try{

    const response =
      await fetch(
        `/api/posts/${id}`,
        {
          method:"DELETE"
        }
      );

    const data =
      await response.json();

    if (!data.success){

      alert(
        "❌ Imeshindikana kufuta post."
      );

      return;

    }

    await loadPosts();

  }catch(error){

    alert(
      "❌ Server haipatikani."
    );

  }

}

loadPosts();

</script>

</body>
</html>
