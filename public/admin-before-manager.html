<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DRACK ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{background:#151515;padding:22px;text-align:center}
.logo{font-size:28px;font-weight:bold}
.sub{color:#999;margin-top:6px}
.container{width:92%;max-width:650px;margin:auto;padding:20px 0}
.card{background:#151515;padding:20px;border-radius:15px}
input,textarea,select{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;font-size:15px}
textarea{min-height:150px;resize:vertical}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;font-weight:bold;font-size:15px}
.file{background:#222;color:#fff}
#preview{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-top:15px;display:none}
#message{text-align:center;margin-top:15px;font-weight:bold}
.success{color:#4cff88}
.error{color:#ff5555}
</style>
</head>

<body>

<header>
<div class="logo">👑 DRACK ADMIN</div>
<div class="sub">Manage DRACK HUB</div>
</header>

<div class="container">
<div class="card">

<h2>➕ Tengeneza Post</h2>

<input id="title" placeholder="Kichwa cha habari">

<select id="category">
<option value="NEWS">📰 NEWS</option>
<option value="SPORTS">⚽ SPORTS</option>
<option value="UPDATES">📢 UPDATES</option>
</select>

<textarea id="content" placeholder="Andika taarifa yako hapa..."></textarea>

<input
  id="imageFile"
  class="file"
  type="file"
  accept="image/*"
>

<img id="preview">

<input id="link" type="url" placeholder="Link nyingine (optional)">

<button onclick="publishPost()">📢 PUBLISH</button>

<div id="message"></div>

</div>
</div>

<script>

let uploadedImage = "";

const imageFile =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

imageFile.addEventListener("change", () => {

  const file = imageFile.files[0];

  if (!file) {
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

});

async function publishPost() {

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const content =
    document.getElementById("content").value.trim();

  const link =
    document.getElementById("link").value.trim();

  const message =
    document.getElementById("message");

  if (!title || !content) {

    message.className = "error";
    message.innerText =
      "❌ Weka kichwa na taarifa.";

    return;
  }

  try {

    /* UPLOAD IMAGE */

    if (imageFile.files.length > 0) {

      message.className = "";
      message.innerText = "📤 Inapakia picha...";

      const formData = new FormData();

      formData.append(
        "image",
        imageFile.files[0]
      );

      const uploadResponse =
        await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

      const uploadData =
        await uploadResponse.json();

      if (!uploadData.success) {

        message.className = "error";
        message.innerText =
          "❌ Picha haikupakiwa.";

        return;
      }

      uploadedImage =
        uploadData.image;
    }

    /* CREATE POST */

    message.innerText =
      "📢 Inachapisha...";

    const response =
      await fetch("/api/posts", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          title,
          category,
          content,
          image: uploadedImage,
          link

        })

      });

    const data =
      await response.json();

    if (data.success) {

      message.className = "success";
      message.innerText =
        "✅ Post imechapishwa!";

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";
      document.getElementById("link").value = "";
      document.getElementById("imageFile").value = "";

      preview.style.display = "none";

      uploadedImage = "";

    } else {

      message.className = "error";
      message.innerText =
        "❌ " +
        (data.message || "Imeshindikana");

    }

  } catch (error) {

    console.error(error);

    message.className = "error";
    message.innerText =
      "❌ Server haipatikani.";

  }

}

</script>

</body>
</html>
